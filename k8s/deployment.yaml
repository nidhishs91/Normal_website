apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-website
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: normal-website
  template:
    metadata:
      labels:
        app: normal-website
    spec:
      containers:
      - name: normal-website
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
      volumes:
      - name: website-content
        configMap:
          name: normal-website-content
