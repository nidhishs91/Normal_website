name: Prod Deploy with Test Insights

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prod-deploy:
    runs-on: ubuntu-latest
    name: Prod Deploy with ServiceNow DevOps CV

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # RUN TESTS
      # -----------------------------
      - name: Run Tests
        run: |
          echo "Running tests..."
          TOTAL_TESTS=100
          PASSED_TESTS=85
          echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV
      # -----------------------------
      # CALCULATE PASS %
      # -----------------------------
      - name: Calculate Test Pass Percentage
        run: |
          PASS_PERCENT=$(( PASSED_TESTS * 100 / TOTAL_TESTS ))
          echo "PASS_PERCENT=$PASS_PERCENT" >> $GITHUB_ENV
          echo "Test Pass Percentage: $PASS_PERCENT%"
      # -----------------------------
      # PUBLISH TEST RESULTS
      # (POPULATES DevOps Insights tables)
      # -----------------------------
      - name: Publish Test Results to ServiceNow DevOps Insights
        run: |
          curl -X POST "${{ secrets.SN_INSTANCE_URL }}/api/sn_devops/v1/devops/testresult" \
          -H "Content-Type: application/json" \
          -u "${{ secrets.SN_DEVOPS_USER }}:${{ secrets.SN_DEVOPS_PASSWORD }}" \
          -d '{
            "toolId": "${{ secrets.SN_ORCHESTRATION_TOOL_ID }}",
            "commitId": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "testExecutionName": "GitHub Actions Unit Tests",
            "totalTests": '"$TOTAL_TESTS"',
            "passedTests": '"$PASSED_TESTS"',
            "failedTests": '"$((TOTAL_TESTS - PASSED_TESTS))"',
            "passPercentage": '"$PASS_PERCENT"',
            "status": "Completed"
          }'
      # -----------------------------
      # -----------------------------
      - name: Create ServiceNow DevOps Change and wait for approval
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-user-name:     ${{ secrets.SN_DEVOPS_USER }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow DevOps Change (Prod Deploy)'

          change-request: >-
            {
              "autoCloseChange": "true",
              "attributes": {
                "short_description": "Prod deploy",
                "description": "Automated deployment via GitHub Actions. Test results published to DevOps Insights.",
                "service_offering":"fe2c2286a8e3e210e2ca594979e38503",
                "u_affected_customers":"07e79318db1cd110761e5fc4e2961901",
                "u_detailed_validation_steps":"Automated tests executed successfully",
                "u_communication_plan":"Standard deployment communication",
                "requested_by":"7bb874b897b34610cc5331200153afa7"
              }
            }
          interval: '30'
          timeout: '3600'

      # -----------------------------
      # DEPLOY
      # -----------------------------
      - name: Deploy to Production
        if: ${{ success() }}
        run: |
          echo "Approval received. Running production deployment..."
          # Add kubectl / helm / ssh commands here


