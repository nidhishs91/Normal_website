name: DevOps Normal Change

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ServiceNowDevOpsChange:
    runs-on: ubuntu-latest
    name: ServiceNow DevOps Change (Prod Deploy)

    steps:
    # -----------------------------------
    # CHECKOUT
    # -----------------------------------
    - name: Checkout
      uses: actions/checkout@v4

    # -----------------------------------
    # CREATE DEVOPS NORMAL CHANGE
    # -----------------------------------
    - name: Create ServiceNow Normal Change
      id: CreateChange
      uses: ServiceNow/servicenow-devops-change@v6.1.0
      with:
        devops-integration-user-name: ${{ secrets.SN_DEVOPS_USER }}
        devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
        instance-url: ${{ secrets.SN_INSTANCE_URL }}
        tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
        context-github: ${{ toJSON(github) }}
        job-name: "ServiceNow DevOps Change (Prod Deploy)"
        interval: "15"
        timeout: "900"
        change-request: >
          {
            "attributes": {
              "short_description": "DevOps Normal Change GH",
              "description": "Production change\nTests successful",
              "service_offering": "fe2c2286a8e3e210e2ca594979e38503",
              "requested_by": "a0e11bb23ba32300b200655593efc491"
            }
          }

    # -----------------------------------
    # ADD WORK NOTES
    # -----------------------------------
    - name: Add Work Notes
      run: |
        SYS_ID="${{ steps.CreateChange.outputs.change-request-sys-id }}"
        echo "Change sys_id = $SYS_ID"

        curl -X PUT \
        "${{ secrets.SN_INSTANCE_URL }}/api/now/table/change_request/${SYS_ID}" \
        --user "${{ secrets.SN_DEVOPS_USER }}:${{ secrets.SN_DEVOPS_PASSWORD }}" \
        --header "Content-Type: application/json" \
        --data "{
          \"work_notes\": \"GitHub Pipeline completed successfully. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
        }"
