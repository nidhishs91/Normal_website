name: Prod Deploy
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, Test & Quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: echo "Build the project..."

      - name: Run Tests (demo numbers)
        run: |
          echo "Running tests..."
          TOTAL_TESTS=100
          PASSED_TESTS=85
          echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV

      - name: Calculate Test Pass Percentage
        run: |
          PASS_PERCENT=$(( PASSED_TESTS * 100 / TOTAL_TESTS ))
          echo "PASS_PERCENT=$PASS_PERCENT" >> $GITHUB_ENV
          echo "Test Pass Percentage: $PASS_PERCENT%"

      # Option A: Use official Action (recommended)
      - name: Publish Test Results to ServiceNow DevOps (Action)
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN_DEMO14 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL_DEMO14 }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build, Test & Quality'
          xml-report-filename: path/to/results.xml
          test-summary-name: 'GitHub Actions Unit Tests'

      # Option B: Raw API (only if you don’t have an XML)
      - name: Publish Test Results to ServiceNow DevOps (curl)
        if: always()
        run: |
          curl -X POST "${{ secrets.SN_INSTANCE_URL_DEMO14 }}/api/sn_devops/v1/devops/tool/test?toolId=${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}&testType=Unit test" \
            -H "Content-Type: application/json" \
            -H "Authorization: sn_devops.DevOpsToken ${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}:${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN_DEMO14 }}" \
            -d '{
              "testExecutionName": "GitHub Actions Unit Tests",
              "branch": "'"${GITHUB_REF_NAME}"'",
              "commitId": "'"${GITHUB_SHA}"'",
              "totalTests": '"${TOTAL_TESTS}"',
              "passedTests": '"${PASSED_TESTS}"',
              "failedTests": '"$((TOTAL_TESTS - PASSED_TESTS))"',
              "passPercentage": '"${PASS_PERCENT}"',
              "status": "Completed"
            }'
