name: Prod Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # =====================================
  # BUILD + TEST + QUALITY
  # =====================================
  build:
    runs-on: ubuntu-latest
    name: Build, Test & Quality

    steps:
      # Checkout pinned to a SHA
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build
        run: |
          echo "Build the project..."
          # your build commands
          

      # -----------------------------
      # RUN TESTS (sample numbers)
      # -----------------------------
      - name: Run Tests
        run: |
          echo "Running tests..."
          TOTAL_TESTS=100
          PASSED_TESTS=85
          echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV

      # -----------------------------
      # CALCULATE PASS %
      # -----------------------------
      - name: Calculate Test Pass Percentage
        run: |
          PASS_PERCENT=$(( PASSED_TESTS * 100 / TOTAL_TESTS ))
          echo "PASS_PERCENT=$PASS_PERCENT" >> $GITHUB_ENV
          echo "Test Pass Percentage: $PASS_PERCENT%"

      # Capture timestamps to correlate in ServiceNow
      - name: Set timestamps
        id: times
        run: |
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          # Simulate duration; in real runs, set 'finish' after tests
          echo "finish=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # -----------------------------
      # SONARQUBE / SONARCLOUD SCAN
      # -----------------------------
      - name: SonarQube (SonarCloud) Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=nidhishs91
            -Dsonar.projectKey=nidhishs91_Normal_website
            -Dsonar.sources=.

      # -----------------------------
      # PUBLISH TEST SUMMARY TO SERVICENOW (CORRECT ENDPOINT)
      # -----------------------------
      - name: Publish Test Summary to ServiceNow DevOps
        env:
          SN_URL: ${{ secrets.SN_INSTANCE_URL_DEMO14 }}
          SN_USER: ${{ secrets.SN_DEVOPS_USER_DEMO14 }}
          SN_PASS: ${{ secrets.SN_DEVOPS_PASSWORD_DEMO14 }}
          SN_TOOL: ${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}
        run: |
          API_URL="$SN_URL/api/sn_devops/v1/devops/tool/test?toolId=$SN_TOOL&testType=Unit"

          # Build the JSON body with run & repo context so SN can link to commit/pipeline
          cat > body.json <<JSON
          {
            "name": "GitHub Actions Unit Tests",
            "pipelineName": "${{ github.workflow }}",
            "stageName": "Build, Test & Quality",
            "buildNumber": "${{ github.run_number }}",
            "buildId": "${{ github.run_id }}",
            "attemptNumber": "${{ github.run_attempt }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "startTime": "${{ steps.times.outputs.start }}",
            "finishTime": "${{ steps.times.outputs.finish }}",
            "totalTests": ${TOTAL_TESTS},
            "passedTests": ${PASSED_TESTS},
            "failedTests": $((TOTAL_TESTS - PASSED_TESTS)),
            "skippedTests": 0,
            "blockedTests": 0,
            "duration": 0.0
          }
          JSON

          echo "Calling ServiceNow Test API: $API_URL"
          curl -sS -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -u "$SN_USER:$SN_PASS" \
            --data @body.json
            
            name: Test API Call Perf
            
            on:  
            workflow_dispatch:
            
            jobs:
  post_api_call_perf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: post_api_call_perf
      run: |
        apiUrl="https://<your_instance>.service-now.com/api/sn_devops/v1/devops/tool/test?toolId=<devops_ToolId>&testType=<performance_test_type>"
        requestBody='{"toolId": "<devops_ToolId>", "buildNumber": '${{ github.run_number }}' , "workflow": "Test API Call Perf", "repository": "<your_GitHub_repository>", "stageName":"post_api_call_perf","pipelineName":"Test API Call Perf", "testType": "Load", "buildNumber": '${{ github.run_number }}', "buildId": '${{ github.run_id }}' , "attemptNumber" : '${{ github.run_attempt }}', "name": "GitHub Test Summary - Performance 1.0","duration": 0.0,"maximumVirtualUsers": 10,"throughput": "5/min","maximumTime": 1000,"minimumTime": 5000,"averageTime": 7000,"startTime": "2023-12-14T23:31:31z","finishTime": "2023-12-14T23:31:31z","ninetyPercent": 8000, "standardDeviation": 2.0 }'
        auth="devops.integration.user:<password> in base64 encoded"
        authHeader="Basic $auth"
        response=$(curl -X POST -H "Content-Type: application/json" -H "Authorization: $authHeader" -d "$requestBody" $apiUrl)
        exitCode=$?
        
        if [ $exitCode -eq 0 ]; then
          echo "API call successful!"
          echo "Response: $response"
        else
          echo "API call failed!"
          echo "Response: $response"
          exit 1
        fi
  # =====================================
  # SERVICENOW CHANGE + DEPLOY
  # =====================================
  ServiceNowDevOpsChange:
    needs: build
    runs-on: ubuntu-latest
    name: ServiceNow DevOps Change (Prod Deploy)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create ServiceNow DevOps Change and wait for approval
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-user-name:     ${{ secrets.SN_DEVOPS_USER_DEMO14 }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD_DEMO14 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL_DEMO14 }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow DevOps Change (Prod Deploy)'
          change-request: >-
            {
              "autoCloseChange":"true",
              "attributes":{
                "short_description":"Prod deploy",
                "description":"Automated deployment via GitHub Actions. Test results and quality metrics published."
              }
            }
          interval: '30'
          timeout: '3600'

      - name: Deploy to Production
        run: |
          echo "Approval received. Running Prod deployment..."
          # your deployment commands
