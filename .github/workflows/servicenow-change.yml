name: Prod Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, Test & Quality

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build
        run: |
          echo "Build the project..."
          # your build commands

      - name: Run Tests (dummy numbers for now)
        run: |
          echo "Running tests..."
          TOTAL_TESTS=100
          PASSED_TESTS=85
          echo "TOTAL_TESTS=$TOTAL_TESTS" >> "$GITHUB_ENV"
          echo "PASSED_TESTS=$PASSED_TESTS" >> "$GITHUB_ENV"
          echo "PASS_PERCENT=$(( PASSED_TESTS * 100 / TOTAL_TESTS ))" >> "$GITHUB_ENV"

          # Minimal JUnit XML (replace with your real framework's report)
          mkdir -p reports
          cat > reports/junit.xml <<'XML'
          <testsuite name="dummy" tests="100" failures="15" errors="0" skipped="0">
            <testcase classname="demo" name="sample1"/>
          </testsuite>
          XML

      - name: SonarQube (SonarCloud) Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=nidhishs91
            -Dsonar.projectKey=nidhishs91_Normal_website
            -Dsonar.sources=.

      # ---- Publish Unit Test Results to ServiceNow DevOps (official action) ----
      - name: Publish Unit Test Results to ServiceNow DevOps
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          # Use ONE auth method. Token (preferred) or Basic:
          # devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          devops-integration-user-name:     ${{ secrets.SN_DEVOPS_USER_DEMO14 }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD_DEMO14 }}

          instance-url: ${{ secrets.SN_INSTANCE_URL_DEMO14 }}

          # IMPORTANT: This MUST be the sys_id of your *GitHub Tool* in ServiceNow
          tool-id: ${{ secrets.SN_GITHUB_TOOL_ID_DEMO14 }}

          context-github: ${{ toJSON(github) }}
          job-name: 'Build, Test & Quality'
          xml-report-filename: reports/junit.xml
          test-summary-name:   'GitHub Actions Unit Tests'

  ServiceNowDevOpsChange:
    needs: build
    runs-on: ubuntu-latest
    name: ServiceNow DevOps Change (Prod Deploy)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create ServiceNow DevOps Change and wait for approval
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-user-name:     ${{ secrets.SN_DEVOPS_USER_DEMO14 }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD_DEMO14 }}
          instance-url: ${{ secrets.SN_INSTANCE_URL_DEMO14 }}

          # For the change step, orchestration tool id is fine — leave as-is if it worked earlier.
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID_DEMO14 }}

          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow DevOps Change (Prod Deploy)'
          change-request: >-
            {
              "autoCloseChange":"true",
              "attributes":{
                "short_description":"Prod deploy",
                "description":"Automated deployment via GitHub Actions. Test results and quality metrics published."
              }
            }
          interval: '30'
          timeout: '3600'

      - name: Deploy to Production
        run: |
          echo "Approval received. Running Prod deployment..."
          # your deployment commands
